name: Deploy to Hetzner (Live Demo)

# Hetzner VPS 94.130.109.67 — demo URL https://pathlens.cognitivebd.com — deploys backend + frontend via docker compose on push to main.
# Required GitHub Secrets (Settings → Secrets → Actions):
#   HETZNER_HOST=94.130.109.67, HETZNER_USER=deploy, HETZNER_SSH_KEY (private key), HETZNER_SSH_PORT (optional, default 22)
#   POSTGRES_PASSWORD, JWT_SIGNING_KEY, JWT_ISSUER, JWT_AUDIENCE, FRONTEND_ORIGIN=https://pathlens.cognitivebd.com, NEXT_PUBLIC_API_BASE_URL=https://pathlens.cognitivebd.com/api (or https://pathlens.cognitivebd.com), OSRM_BASE_URL
#   AI_PROVIDER=Meta, META_AI_ENDPOINT, META_AI_MODEL, META_AI_API_KEY (G1 live: e.g. https://api.groq.com/openai/v1/chat/completions + meta-llama/llama-4-maverick-17b-128e-instruct + gsk_... — see docs/SECURITY.md; Mock only for tests)
# Optional: DATUMFEED_API_KEY, CAMERAS_POLLING_ENABLED

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build backend/PathLens.slnx -c Release
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm', cache-dependency-path: 'apps/web/package-lock.json' }
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web

  deploy:
    needs: verify
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Deploy via SSH to Hetzner
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/pathlens || (echo "Cloning at /opt/pathlens" && sudo mkdir -p /opt && sudo chown $USER:$USER /opt && git clone https://github.com/basithalam/PathLens-AI.git /opt/pathlens && cd /opt/pathlens)
            cd /opt/pathlens
            # DEBUG: show what git sees (to find stale token source)
            echo "=== GIT DEBUG ==="; git remote -v || true; git config --list --show-origin | grep -i -E "credential|helper|extraHeader|insteadOf|url\." | head -20 || true; cat ~/.git-credentials 2>&1 | head -5 || true; cat ~/.config/git/credentials 2>&1 | head -5 || true; echo "=== END DEBUG ==="
            # Public repo — Hetzner sends stale token even for public URL, so reset remote and wipe all credential sources
            git remote set-url origin https://github.com/basithalam/PathLens-AI.git || true
            git remote set-url --push origin https://github.com/basithalam/PathLens-AI.git || true
            # Remove any url.*.insteadOf that injects token, and extraHeader
            git config --global --unset credential.helper || true
            git config --unset credential.helper || true
            git config --global credential.helper "" || true
            git config credential.helper "" || true
            git config --global --unset http.https://github.com/.extraHeader || true
            git config --unset http.https://github.com/.extraHeader || true
            git config --global --unset url.https://x-access-token:.extraHeader || true
            for key in $(git config --list --name-only 2>/dev/null | grep -i "extraHeader\|insteadOf" || true); do git config --global --unset "$key" || true; git config --unset "$key" || true; done
            rm -f ~/.git-credentials ~/.config/git/credentials /tmp/.git-credentials || true
            # Most robust: ignore ALL git configs and use ephemeral HOME — but Hetzner still sends stale token, so fallback to curl tarball
            GIT_CONFIG_COUNT=0 GIT_CONFIG_NOSYSTEM=1 GIT_CONFIG_NOGLOBAL=1 HOME=/tmp GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=echo git -c credential.helper= -c core.askPass= -c http.extraHeader= fetch --depth=1 --no-tags https://github.com/basithalam/PathLens-AI.git main && git reset --hard FETCH_HEAD || GIT_CONFIG_COUNT=0 GIT_CONFIG_NOSYSTEM=1 HOME=/tmp GIT_TERMINAL_PROMPT=0 GIT_ASKPASS=echo git -c credential.helper= pull --ff-only origin main || (echo "git still failed — trying curl tarball bypass (no git credentials needed)" && curl -L https://github.com/basithalam/PathLens-AI/archive/refs/heads/main.tar.gz -o /tmp/main.tar.gz && tar -xzf /tmp/main.tar.gz -C /tmp && rm -rf /opt/pathlens/.git && cp -a /tmp/PathLens-AI-main/. /opt/pathlens/ && cp -a /tmp/PathLens-AI-main/.git /opt/pathlens/ 2>/dev/null || true && cd /opt/pathlens && git init -q && git remote add origin https://github.com/basithalam/PathLens-AI.git || true && git reset --hard FETCH_HEAD 2>/dev/null || git checkout -B main && echo "curl tarball bypass succeeded")
            # Write .env for compose (never committed) — Hetzner multi-tenant ports must stay
            cat > .env <<EOF
            POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }}
            JWT_SIGNING_KEY=${{ secrets.JWT_SIGNING_KEY }}
            JWT_ISSUER=${{ secrets.JWT_ISSUER || 'PathLens' }}
            JWT_AUDIENCE=${{ secrets.JWT_AUDIENCE || 'PathLensWeb' }}
            FRONTEND_ORIGIN=${{ secrets.FRONTEND_ORIGIN || 'https://pathlens.cognitivebd.com' }}
            NEXT_PUBLIC_API_BASE_URL=${{ secrets.NEXT_PUBLIC_API_BASE_URL || 'https://pathlens.cognitivebd.com' }}
            OSRM_BASE_URL=${{ secrets.OSRM_BASE_URL || 'https://router.project-osrm.org' }}
            AI_PROVIDER=${{ secrets.AI_PROVIDER || 'Meta' }}
            META_AI_ENDPOINT=${{ secrets.META_AI_ENDPOINT || '' }}
            META_AI_MODEL=${{ secrets.META_AI_MODEL || '' }}
            META_AI_API_KEY=${{ secrets.META_AI_API_KEY || '' }}
            CAMERAS_POLLING_ENABLED=${{ secrets.CAMERAS_POLLING_ENABLED || 'false' }}
            # Seeded account credentials. Left unset, the API keeps the documented local-development
            # defaults; set them and the next startup re-hashes those accounts, which is how the
            # publicly documented passwords stop working on this host.
            Auth__SeedReviewerPassword=${{ secrets.DEMO_REVIEWER_PASSWORD }}
            Auth__SeedAdminPassword=${{ secrets.DEMO_ADMIN_PASSWORD }}
            Auth__SeedUserPassword=${{ secrets.DEMO_USER_PASSWORD }}
            WEB_PORT=3001
            API_PORT=5145
            DB_PORT=5433
            ASPNETCORE_ENVIRONMENT=Production
            EOF
            cat .env | grep -v PASSWORD | grep -v JWT_SIGNING | grep -v API_KEY || true
            docker compose pull || true
            docker compose up --build -d
            sleep 10
            curl -f http://127.0.0.1:5145/health/live || (docker compose logs api --tail 100 && exit 1)
            # Degraded is OK for OSRM (public OSRM 403 from Hetzner IP) — require DB + AI Healthy
            curl -s http://127.0.0.1:5145/health/ready > /tmp/ready.json; cat /tmp/ready.json || true
            grep -q '"name":"database".*"status":"Healthy"' /tmp/ready.json || (echo "database not Healthy" && docker compose logs api --tail 100 && exit 1)
            grep -q '"name":"ai-provider".*"status":"Healthy"' /tmp/ready.json || (echo "ai-provider not Healthy — check META_AI_API_KEY" && docker compose logs api --tail 100 && exit 1)
            echo "health/ready: DB + AI Healthy (OSRM Degraded allowed)"
            curl -f http://127.0.0.1:3001/ || echo "web not yet ready — check WEB_PORT=3001"
            docker compose ps
