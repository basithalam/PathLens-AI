name: Deploy (Vercel auto-deploy)

# Vercel auto-deploy: Push to main → Vercel builds apps/web automatically when
# repo is connected to Vercel (Import → basithalam/PathLens-AI, Root Directory: apps/web).
# This workflow verifies build and optionally triggers Vercel via action when secrets are set.
# Required GitHub Secrets (Settings → Secrets → Actions): VERCEL_TOKEN, VERCEL_ORG_ID, VERCEL_PROJECT_ID
# Optional Render backend: RENDER_DEPLOY_HOOK_URL (from Render Dashboard → Deploy Hook)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build backend/PathLens.slnx -c Release
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm', cache-dependency-path: 'apps/web/package-lock.json' }
      - run: npm ci --prefix apps/web
      - run: npm run build --prefix apps/web

  deploy-frontend:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      # If Vercel secrets are set, deploy via action; otherwise Vercel's own GitHub integration will auto-deploy
      - name: Deploy to Vercel
        uses: amondnet/vercel-action@v25
        continue-on-error: true
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          working-directory: ./apps/web
          vercel-args: '--prod'
        env:
          NEXT_PUBLIC_API_BASE_URL: ${{ secrets.NEXT_PUBLIC_API_BASE_URL }}

      - name: Note if not configured
        if: failure()
        run: echo "Vercel deploy skipped — connect repo to Vercel Dashboard (Import → Root: apps/web, Env: NEXT_PUBLIC_API_BASE_URL) or set VERCEL_TOKEN/ORG_ID/PROJECT_ID secrets. See docs/DEPLOY_VERCEL.md"

  deploy-backend:
    needs: verify
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - name: Trigger Render deploy hook (backend PostGIS)
        continue-on-error: true
        run: |
          if [ -n "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" ]; then
            curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK_URL }}" && echo "Render hook triggered"
          else
            echo "RENDER_DEPLOY_HOOK_URL not set — create Render Web Service (Docker: ./backend/Dockerfile, Env: POSTGRES_PASSWORD, JWT_SIGNING_KEY, NEXT_PUBLIC_API_BASE_URL) and add its Deploy Hook secret. See docs/DEPLOY_VERCEL.md"
          fi
