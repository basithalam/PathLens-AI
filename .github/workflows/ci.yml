name: CI
on: [push, pull_request]
jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: '10.0.x' }
      - run: dotnet build backend/PathLens.slnx -c Release
      - run: dotnet test backend/PathLens.slnx --filter "FullyQualifiedName~UnitTests"
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20, cache: 'npm', cache-dependency-path: 'apps/web/package-lock.json' }
      - run: npm ci --prefix apps/web
      - run: npm run lint --prefix apps/web
      - run: npm run typecheck --prefix apps/web
      - run: npm run build --prefix apps/web
  health:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - run: echo "health: /health/live always, /health/ready needs DB; OSRM + AI provider ping in next iteration (see H5.3)"